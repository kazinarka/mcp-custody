[project]
name = "custody-bench"
version = "0.1.0"
description = "AgentDojo harness for evaluating mcp-custody"
authors = [
    { name = "illia-fedotov-dev", email = "illia.fedotov1807@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agentdojo==0.1.35",
    "mcp>=2.3,<3",
]

[project.scripts]
custody-bench = "custody_bench.run:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
